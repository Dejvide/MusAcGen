<!DOCTYPE html>
<html>
    <head>
        <title>MusAcGen</title>
        <link rel="stylesheet" href="{{ static_url('style.css') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Monoton&display=swap" rel="stylesheet">
        <!-- script for alphatab player -->
        <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.min.js"></script>
    </head>
    
    <body>
        <h1>MusAcGen</h1>
        <h2>Music Accompaniment Generator</h2>

        
        <div class="actions">
            <a href="/" class="btn btn-back">Return</a>
            <a href="/downloadMidi" class="btn btn-download" download>Download</a>
        </div>

        <div class="controls">
            <!-- the play button is disabled until the script is loaded -->
            <button id="playPause" disabled> Play / Pause </button>
        </div>
        <!-- container for the sheet music -->
        <div id="alphaTab" data-xml-url="/downloadXml"></div>
        <!-- load the script -->
        <script src="{{ static_url('js/alphaTabPlayer.js') }}"></script>

    </body>
</html>
